name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pnpm and Node.js LTS
        uses: pnpm/setup@v3.1.1
        with:
          require-lockfile: true
          runtime: node@24

      - name: Verify and test offline native integration
        env:
          CGO_ENABLED: "1"
        run: pnpm run check
