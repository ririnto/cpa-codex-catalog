# Replace the base path with an existing read-only Codex models_cache.json or full catalog.
# Relative paths resolve from the CLIProxyAPI process working directory.
# Keep operator-owned changes in the partial override file.
plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-codex-catalog:
      enabled: true
      priority: 1
      catalog_path: "/path/to/existing/models_cache.json"
      overrides_path: "./data/overrides.json"
      # Set this to an environment variable name when the resource needs bearer authentication.
      # The same variable name belongs in Codex provider `env_key`.
      # bearer_token_env: "CODEX_CATALOG_TOKEN"
