version: '3'

vars:
  VERSION: '{{.VERSION | default "0.3.0"}}'
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH
  EXT: '{{if eq .GOOS "darwin"}}dylib{{else if eq .GOOS "windows"}}dll{{else}}so{{end}}'
  ARTIFACT: 'build/plugins/{{.GOOS}}/{{.GOARCH}}/cpa-codex-catalog.{{.EXT}}'

tasks:
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Check Go formatting
    cmds:
      - |
        set -eu
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          printf '%s\n' "$unformatted"
          exit 1
        fi

  test:
    desc: Run package tests with synthetic fixtures
    cmds:
      - go test ./cmd/catalog-export ./cmd/cpa-codex-catalog ./internal/catalog

  test-race:
    desc: Run package tests with the race detector
    cmds:
      - go test -race ./cmd/catalog-export ./cmd/cpa-codex-catalog ./internal/catalog

  vet:
    desc: Run Go static checks
    cmds:
      - go vet ./...

  build:
    desc: Build the native shared library for the current platform
    env:
      CGO_ENABLED: '1'
    cmds:
      - mkdir -p 'build/plugins/{{.GOOS}}/{{.GOARCH}}'
      - go build -mod=readonly -trimpath -buildvcs=false -buildmode=c-shared -ldflags '-X main.pluginVersion={{.VERSION}}' -o '{{.ARTIFACT}}' ./cmd/cpa-codex-catalog
      - rm -f 'build/plugins/{{.GOOS}}/{{.GOARCH}}/cpa-codex-catalog.h'

  integration:
    desc: Run prepared synthetic native integration
    cmds:
      - sh scripts/run-native-offline.sh

  prepare-native:
    desc: Build the pinned CLIProxyAPI host and native integration test binary
    cmds:
      - task: build
      - sh scripts/prepare-native.sh

  check:
    desc: Run formatting, unit tests, static checks, and required prepared native integration
    cmds:
      - task: fmt-check
      - task: prepare-native
      - task: test-race
      - task: vet
      - task: integration
